services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: canteen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: canteen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - canteen-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen -d canteen"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  canteen-postgres:
