# Serves the dashboard and proxies /api to the API container on the same origin, so staff
# cookies stay first-party. Put an HTTPS reverse proxy (or load balancer) in front of this.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    # Security headers are added to dashboard files below; /api responses carry the API's own.

    location /api/v1/staff/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 30d;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }
}
